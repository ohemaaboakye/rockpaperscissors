<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <p> Play Rock Paper Scissors with a Computer! Best out of five! </p>
        <p id="name"> Created by Ohemaa Boakye</p>
    </div>
    <h1 id="heading"> Ready? Pick your Weapon</h1>
    <div class="buttons">
        <button id="rock"> Rock 🪨 </button>
        <button id="paper"> Paper 📄 </button>
        <button id="scissors"> Scissors ✂️</button>
    </div>
    <div class="computer">
        <h1> Computer's Choice</h1>
        <p> The Computer Has Selected: </p>

        <div class="cbuttons">
            <button id="crock"> Rock 🪨 </button>
            <button id="cpaper"> Paper 📄 </button>
            <button id="cscissors"> Scissors ✂️</button>
        </div>
       
        
    </div>
    
    <div class="results">
        <h2 id="scoreheading"> Score Board </h2>

        <div class="scores">
            <p> Your Score: </p>
            <p> Computer's Score: </p>

        </div>

        <div class="score_display">
                <h1 id="user_ui"> 0 </h1>
                <h1 id="comp_ui"> 0 </h1>
            </div>

        <div class="final">
            
        </div>



    
    </div>
</body>
</html>
